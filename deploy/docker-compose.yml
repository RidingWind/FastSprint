version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fastsprint-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastsprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastsprint-network

  redis:
    image: redis:7-alpine
    container_name: fastsprint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastsprint-network

  user-service:
    build:
      context: ../backend/user-service
      dockerfile: ../../deploy/docker/user-service.Dockerfile
    container_name: fastsprint-user-service
    ports:
      - "8001:8001"
    environment:
      - SERVER_PORT=8001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=fastsprint
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=fastsprint-jwt-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastsprint-network

  project-service:
    build:
      context: ../backend/project-service
      dockerfile: ../../deploy/docker/project-service.Dockerfile
    container_name: fastsprint-project-service
    ports:
      - "8002:8002"
    environment:
      - SERVER_PORT=8002
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=fastsprint
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=fastsprint-jwt-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastsprint-network

  task-service:
    build:
      context: ../backend/task-service
      dockerfile: ../../deploy/docker/task-service.Dockerfile
    container_name: fastsprint-task-service
    ports:
      - "8003:8003"
    environment:
      - SERVER_PORT=8003
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=fastsprint
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=fastsprint-jwt-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastsprint-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    container_name: fastsprint-frontend
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - project-service
      - task-service
    networks:
      - fastsprint-network

volumes:
  postgres_data:
  redis_data:

networks:
  fastsprint-network:
    driver: bridge
